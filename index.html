<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Kuis</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }

      /* Wrapper canvas — relatif biar input bisa diposisikan absolut di atasnya */
      #game-wrapper {
        position: relative;
        width: 800px;
        height: 400px;
      }

      canvas {
        border: 4px solid #fbd000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }

      /* ---------- FORM INPUT ---------- */
      #start-form {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 225px; /* ← dari 175 jadi 218 (turunin) */
        gap: 10px;
      }

      #start-form.visible {
        display: flex;
      }

      /* Setiap baris = label + input */
      .form-row {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      .form-row label {
        display: inline-block;
        width: 100px;
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        /* Outline teks biar keliatan di background apapun */
        text-shadow:
          2px 2px 0 #000,
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000;
      }

      .form-row input {
        width: 280px;
        padding: 9px 14px;
        font-size: 15px;
        border: 3px solid #000;
        border-radius: 8px;
        outline: none;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #000000;
        box-shadow: 0 3px 0 #000;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .form-row input:focus {
        border-color: #fbd000;
        box-shadow: 0 3px 0 #fbd000;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <!-- Canvas Phaser bakal dibuat di dalam wrapper ini -->

      <div id="start-form">
        <div class="form-row">
          <label for="input-nama">Nama</label>
          <input type="text" id="input-nama" placeholder="Ketik nama lengkap" maxlength="30" />
        </div>
        <div class="form-row">
          <label for="input-absen">No. Absen</label>
          <input type="number" id="input-absen" placeholder="Nomor absen (1-50)" min="1" max="50" />
        </div>
      </div>
    </div>

    <!-- Phaser & script game -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/scenes/StartScene.js"></script>
    <script src="js/scenes/StageScene.js"></script>
    <script src="js/scenes/QuestionScene.js"></script>
    <script src="js/scenes/FinishScene.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
