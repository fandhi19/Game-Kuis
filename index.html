<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mario Kuis</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #game-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 800px;
        height: 400px;
        max-width: 100vw;
        max-height: 100vh;
      }

      canvas {
        border: 4px solid #fbd000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* ---------- FORM INPUT ---------- */
      #start-form {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 218px;
        gap: 10px;
      }

      #start-form.visible {
        display: flex;
      }

      .form-row {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      .form-row label {
        display: inline-block;
        width: 100px;
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        text-shadow:
          2px 2px 0 #000,
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000;
      }

      .form-row input {
        width: 280px;
        padding: 9px 14px;
        font-size: 16px;
        border: 3px solid #000;
        border-radius: 8px;
        outline: none;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #000000;
        box-shadow: 0 3px 0 #000;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .form-row input:focus {
        border-color: #fbd000;
        box-shadow: 0 3px 0 #fbd000;
      }

      /* ---------- MOBILE ADJUSTMENT ---------- */
      @media (max-width: 820px) {
        #game-wrapper {
          width: 100vw;
          height: calc(100vw / 2);
          max-height: 100vh;
        }

        #start-form {
          padding-top: 55%;
          gap: 6px;
        }

        .form-row label {
          font-size: 12px;
          width: 70px;
        }

        .form-row input {
          width: 180px;
          padding: 6px 10px;
          font-size: 13px;
        }
      }

      /* Landscape orientation warning */
      @media (max-width: 820px) and (orientation: portrait) {
        body::after {
          content: "📱 Putar HP ke mode LANDSCAPE untuk pengalaman terbaik!";
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(0, 0, 0, 0.9);
          color: #fbd000;
          padding: 20px 30px;
          border-radius: 12px;
          font-size: 16px;
          font-weight: bold;
          text-align: center;
          z-index: 9999;
          max-width: 80vw;
          border: 3px solid #fbd000;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="start-form">
        <div class="form-row">
          <label for="input-nama">Nama</label>
          <input type="text" id="input-nama" placeholder="Ketik nama lengkap" maxlength="30" />
        </div>
        <div class="form-row">
          <label for="input-absen">No. Absen</label>
          <input type="number" id="input-absen" placeholder="Nomor absen (1-50)" min="1" max="50" />
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/scenes/StartScene.js"></script>
    <script src="js/scenes/StageScene.js"></script>
    <script src="js/scenes/QuestionScene.js"></script>
    <script src="js/scenes/FinishScene.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
